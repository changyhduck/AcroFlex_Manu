name: Markdown quality

on:
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdown.yml"
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v20
